# KudoStack Gateway — Cloudflare Worker untuk subdomain undangan.
# Panduan lengkap: ../admin/docs/SUBDOMAIN.md (juga di menu "Panduan" panel admin).

name = "kudo-gateway"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Worker menangani SEMUA subdomain kudostack.my.id. Subdomain sistem
# (www, admin, tpl-*, undangan, wedding1–8, dst.) diteruskan apa adanya ke origin DNS-nya.
routes = [
  { pattern = "*.kudostack.my.id/*", zone_name = "kudostack.my.id" },
]

[vars]
ROOT_DOMAIN = "kudostack.my.id"
# ROOT_DOMAIN harus sama dengan "Domain induk" di admin (menu Domain).
# Subdomain milik sistem yang BUKAN undangan, dipisah koma:
#   undangan            → panel admin
#   wedding1 … wedding9 → app template kudo … kudo-9
# Daftar yang sama juga diisi di admin (menu Domain → nama yang dicadangkan) agar
# tidak bisa dipakai sebagai slug. Tes gateway memeriksa daftar ini.
# Menambah template baru (wedding9, …)? Tambahkan di sini DAN di menu Domain.
RESERVED_SUBDOMAINS = "undangan,wedding1,wedding2,wedding3,wedding4,wedding5,wedding6,wedding7,wedding8,wedding9"

# Rahasia — JANGAN ditulis di sini. Atur dengan:
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_ANON_KEY
#   npx wrangler secret put GATEWAY_SECRET

# ── Pengembangan lokal: `npm run dev` ─────────────────────────────────────
# `routes` DIWARISKAN ke env lain, jadi harus dikosongkan di sini. Bila tidak,
# wrangler dev menulis ulang Host ke kudostack.my.id dan meneruskan request ke situs
# produksi. Dengan routes kosong, http://cahya-wahyu.localhost:8787 terbaca sebagai
# subdomain undangan. Nilai lain dibaca dari .dev.vars.
[env.dev]
name = "kudo-gateway-dev"
routes = []

[env.dev.vars]
ROOT_DOMAIN = "localhost"
RESERVED_SUBDOMAINS = ""
