# KudoStack — self-hosting admin + semua template di satu server.
# Panduan: docs/SETUP-KudoStack.md (Docker) & docs/SETUP-DOMAIN.md (domain & gateway)
#
#   cp docker.env.example .env      # isi rahasia
#   docker compose pull && docker compose up -d
#
# Tidak ada port yang dibuka ke internet. Satu-satunya jalan masuk adalah Cloudflare
# Tunnel `cloudflared` yang sudah berjalan di server dan terhubung ke network
# eksternal `cloudflare_net`:
#   undangan.kudostack.my.id                    → admin
#   wedding1.kudostack.my.id … wedding9.kudostack.my.id → kudo … kudo-9
# Subdomain undangan (<slug>.kudostack.my.id) tetap dilayani Cloudflare Worker di
# gateway/, yang mengambil halaman dari wedding1…8.

name: kudostack

# Pengaturan bersama setiap app Next.js.
x-app: &app
  restart: unless-stopped
  init: true
  mem_limit: 512m
  networks:
    - default
    - cloudflare_net
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Variabel yang dipakai semua template (TEMPLATE_CODE ditambahkan per layanan).
x-template-env: &template-env
  SUPABASE_URL: ${SUPABASE_URL:?isi SUPABASE_URL di .env}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?isi SUPABASE_SERVICE_ROLE_KEY di .env}
  PREVIEW_SECRET: ${PREVIEW_SECRET:?isi PREVIEW_SECRET di .env}
  GATEWAY_SECRET: ${GATEWAY_SECRET:?isi GATEWAY_SECRET di .env}

services:
  admin:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-admin:${IMAGE_TAG:-latest}
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?isi SUPABASE_URL di .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?isi SUPABASE_SERVICE_ROLE_KEY di .env}
      SESSION_SECRET: ${SESSION_SECRET:?isi SESSION_SECRET di .env}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?isi PREVIEW_SECRET di .env}
    # Untuk uji di server tanpa tunnel, buka sementara: ports: ["127.0.0.1:3001:3000"]

  kudo:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo }

  kudo-2:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo-2:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo-2 }

  kudo-3:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo-3:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo-3 }

  kudo-4:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo-4:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo-4 }

  kudo-5:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo-5:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo-5 }

  kudo-6:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo-6:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo-6 }

  kudo-7:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo-7:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo-7 }

  kudo-8:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo-8:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo-8 }

  kudo-9:
    <<: *app
    image: ${IMAGE_NAMESPACE:-kudostack}/wedding-invitation-kudo-9:${IMAGE_TAG:-latest}
    environment: { <<: *template-env, TEMPLATE_CODE: kudo-9 }

networks:
  cloudflare_net:
    external: true
